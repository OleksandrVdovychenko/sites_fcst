# Панель контенту ФКНТ (Sveltia CMS). Автори працюють з формою, не з кодом.
# Поля точно відповідають схемі src/content/config.ts — інакше білд не пройде.

backend:
  name: github
  repo: ORG/fcst-web          # ← замінити на свій GitHub org/repo
  branch: main
  base_url: https://auth.fcst.kai.edu.ua   # ← ваш sveltia-cms-auth Worker (див. CMS-SETUP.md)

# Ключове: чернетка → «на розгляді» → публікація. Кожен запис іде через PR,
# який зливає рецензент. Це і є обов'язковий крок перевірки офіційного контенту.
publish_mode: editorial_workflow

# Фото новин: автор перетягує у форму → лягає в public/news, у тексті — /news/...
media_folder: "public/news"
public_folder: "/news"

locale: uk

collections:
  - name: news
    label: "Новини"
    label_singular: "Новина"
    description: "Стрічка новин факультету"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Заголовок", widget: string, hint: "До ~90 символів" }
      - { name: date, label: "Дата", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - name: category
        label: "Категорія"
        widget: select
        default: "Новини"
        options: ["Новини", "Досягнення", "Події", "Вступ", "Наука"]
      - { name: cover, label: "Обкладинка", widget: image, required: false, hint: "Необов'язково" }
      - { name: summary, label: "Короткий опис", widget: text, pattern: ['^.{0,240}$', "До 240 символів"], hint: "1–2 речення для картки у стрічці" }
      - { name: draft, label: "Прихована на сайті", widget: boolean, default: false }
      - { name: body, label: "Текст новини", widget: markdown }

  # Приклад редагування структурної сторінки як тексту (файлова колекція).
  # Працює лише якщо сторінка змодельована як контент (напр. src/content/pages/about.md),
  # а не як .astro-розмітка. Див. примітку в CMS-SETUP.md.
  - name: pages
    label: "Сторінки (текст)"
    files:
      - name: about
        label: "Про факультет"
        file: "src/content/pages/about.md"
        fields:
          - { name: title, label: "Заголовок", widget: string }
          - { name: body, label: "Текст", widget: markdown }
